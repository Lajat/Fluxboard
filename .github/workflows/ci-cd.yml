name: Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @fluxboard/shared-types build

      - name: Build API
        run: pnpm --filter @fluxboard/api build

      - name: Typecheck web (Next.js build)
        run: pnpm --filter @fluxboard/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

      - name: Run unit tests
        run: pnpm test

  deploy-api:
    needs: build-and-test
    # Deploy ONLY when a release is published, ensuring build-and-test passed
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package deployment bundle
        run: |
          zip -r deploy.zip . \
            -x "node_modules/*" -x "apps/web/*" -x ".git/*" \
            -x ".next/*" -x "*/dist/*" -x "*.env" -x "*.log"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: fluxboard-api
          environment_name: fluxboard-api-env
          region: ${{ secrets.AWS_REGION }}
          # Use the release tag (e.g., v1.0.0) as the app version
          version_label: "fluxboard-${{ github.ref_name }}"
          deployment_package: deploy.zip